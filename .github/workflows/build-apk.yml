name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name nova_drift --org com.mentrc.novadrift

      - name: Disable Impeller renderer
        # WHY: Impeller is Android's default renderer since Flutter 3.27, and
        # there are multiple confirmed reports (flutter/flutter#176272 and
        # others) of it freezing rendering entirely - with no Dart-visible
        # error - on specific real Android devices, especially in --release
        # builds. That symptom matches this project exactly: the first
        # frame paints, then nothing else ever runs (no further frames, so
        # Flame's Ticker-driven onLoad/update never fire either). The
        # documented workaround is this meta-data flag, which switches back
        # to the older, more broadly-compatible Skia renderer.
        run: |
          sed -i '/<activity/i\        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />' android/app/src/main/AndroidManifest.xml
          echo "--- AndroidManifest.xml after patch ---"
          cat android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-drift-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Attach APK to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nova-drift-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
