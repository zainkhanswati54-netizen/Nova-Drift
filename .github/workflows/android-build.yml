name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project doesn't commit a Gradle wrapper jar (built offline, no network
      # access to fetch the binary) — this action installs a pinned Gradle version
      # instead and gives us build caching for free. If you later run
      # `gradle wrapper` locally (e.g. from Android Studio) and commit gradlew,
      # you can swap the "Build" step below to `./gradlew :android:assembleDebug`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle :android:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-drift-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
