name: nova_drift
description: "Nova Drift - an arcade wave rider game built with Flutter & Flame."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Flame game engine - gameplay (Coming Soon) is built on this
  flame: ^1.18.0
  # Google Fonts for the bold rounded game typography
  google_fonts: ^6.2.1
  # Local persistence for gems / progress / settings
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Add game sprites / audio here later:
  # assets:
  #   - assets/images/
  #   - assets/audio/
