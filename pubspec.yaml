name: nova_drift
description: "Nova Drift - an arcade wave rider game built with Flutter & Flame."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Flame game engine - gameplay (Coming Soon) is built on this
  flame: ^1.18.0
  # Google Fonts for the bold rounded game typography
  google_fonts: ^6.2.1
  # Local persistence for gems / progress / settings
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates the Android launcher icon (mipmap set) + adaptive icon
  # from assets/icon/*.png - see the "Generate app icon" CI step.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Config used by flutter_launcher_icons (dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
